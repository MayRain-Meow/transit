<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f9f7"><title>交通线 · 城市成长测试版 0.4</title><link rel="stylesheet" href="style.css?v=4"></head>
<body><canvas id="map"></canvas>
<header><div class="brand"><span class="brand-symbol">↗</span><div><b>交通线<span>东岸</span></b><small>NETWORK WORLD / 0.4</small></div></div><div class="calendar"><small id="year">第一年 · 一月</small><b id="date">01 / 01 <span>周一</span></b><small id="calendar-tag">距补助10天</small></div><div class="stats"><div><small>已送达</small><b id="delivered">0</b></div><div><small>资金 <button id="finance" title="收支账本">↗</button></small><b id="points">0</b><small id="maintenance-estimate">月底维护 ¥0</small></div></div><div class="time"><button id="fullscreen" title="横屏全屏">全屏</button><span id="lives" title="剩余生命">♥ ♥</span><button id="pause" title="暂停">Ⅱ</button><button id="speed">1×</button><button id="tasks" title="城市任务">任务</button><button id="help" title="操作说明">?</button></div></header>
<div class="map-caption"><span class="eyebrow">东 岸 · 0.4</span><span>沿海平原 · 河谷 · 北岭</span></div>
<div id="notice" class="notice"></div><div id="toast" role="status"></div>
<aside id="routes" class="panel route-panel"><div class="panel-heading"><span>交通网络 <small id="routecount">0 条线路</small></span><button id="collapse">−</button></div><div id="route-list"></div><button id="newroute" class="add-route">＋ 新建线路</button><div class="route-foot"><span id="stock"></span><button id="overview" title="查看全图">⌖</button></div></aside>
<aside id="junction-picker" class="panel" hidden></aside>
<aside id="details" class="panel detail-panel" hidden></aside>
<footer><div class="legend"><span><i class="hill-dot"></i>丘陵减速</span><span><i class="mount-dot"></i>山地需隧道</span><span><i class="river-dot"></i>跨河需桥梁</span></div><button id="engineering" class="operations-button">工程 / 天气</button><button id="operations" class="operations-button">♫ 运营中心</button><button id="shop" class="shop-button"><span>⊞</span> 交通采购 <small id="next-supply">10日补给</small></button></footer>
<div id="delete-drop" hidden></div>
<div id="drawbar" hidden><span id="drawtext"></span><button id="drawcancel">取消</button><button id="drawdone" class="primary">完成线路</button></div>
<div id="modal" class="overlay" hidden><section id="modal-content" class="modal"></section></div>
<div id="orientation-hint" hidden><span id="orientation-status">横屏视野更宽，也可竖屏游玩</span><button id="landscape-enter">横屏</button><button id="dismiss-orientation" aria-label="关闭横屏建议">×</button></div>
<script src="game.js?v=4"></script><script src="progression.js?v=4"></script><script src="world.js?v=4"></script><script src="economy.js?v=4"></script></body></html>
